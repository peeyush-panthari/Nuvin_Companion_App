name: nuvin_mobile
description: "A Trusted, Consent-First AI Companion & Assistant for Everyday Life"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^2.4.1
  http: ^1.2.0
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  flutter_local_notifications: ^17.0.0
  proximity_sensor: ^1.3.3
  audioplayers: ^6.0.0
  record: ^5.2.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  path: ^1.9.0
  flutter_svg: ^2.0.10+1
  record_platform_interface: ^1.1.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_platform_interface: 1.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/intro/

